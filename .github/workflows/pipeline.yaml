name: ML Pipeline with Gatekeeper

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:

  linter:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install flake8
        run: pip install flake8

      - name: Run Linter
        run: flake8 train.py

  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: linter

    if: |
      needs.linter.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      contains(github.event.head_commit.message, '[run-train]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Pull Data with DVC
        env:
          DAGSHUB_USERNAME: ${{ secrets.DAGSHUB_USERNAME }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          pip install dvc
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user "$DAGSHUB_USERNAME"
          dvc remote modify origin --local password "$DAGSHUB_TOKEN"
          dvc pull

      - name: Train Model
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        run: python train.py --epochs 5 --learning_rate 0.01 --run_name "ci-run"

      - name: Capture Error Logs
        if: failure()
        run: |
          echo "=== Training Job Failed ===" > error_logs.txt
          echo "Timestamp : $(date -u)" >> error_logs.txt
          echo "Branch    : ${{ github.ref }}" >> error_logs.txt
          echo "Commit SHA: ${{ github.sha }}" >> error_logs.txt
          echo "Commit msg: ${{ github.event.head_commit.message }}" >> error_logs.txt
          echo "" >> error_logs.txt
          echo "Check the step logs above for the full stack trace." >> error_logs.txt

      - name: Upload error_logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs
          path: error_logs.txt

      - name: Cleanup
        if: always()
        run: echo "Cleaning up temporary cloud volumes..."
